<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gården">
<meta name="theme-color" content="#9fd8ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gården</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd8ff; font-family: 'Baloo 2', system-ui, sans-serif; touch-action: none; }
  #app canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5;
    padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #stars { display: flex; gap: 4px; }
  .star { width: 40px; height: 46px; font-size: 33px; line-height: 46px; text-align: center; filter: grayscale(1) opacity(.45); transition: transform .4s cubic-bezier(.3,1.8,.5,1), filter .3s; }
  .star.on { filter: none; transform: scale(1.25) rotate(-8deg); }
  #mute { position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); pointer-events: auto;
    width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgba(255,255,255,.75); font-size: 24px; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  #egg-hud { display: flex; gap: 6px; margin-top: 8px; opacity: 0; transform: translateY(-10px); transition: .3s; }
  #egg-hud.show { opacity: 1; transform: none; }
  .egg-icon { width: 40px; height: 50px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: rgba(255,255,255,.35); border: 3px dashed rgba(255,255,255,.9); transition: .3s; }
  .egg-icon.on { background: #fff3d6; border: 3px solid #3a2516; transform: scale(1.1); }
  #bubble { z-index: 6; position: absolute; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translate(-50%, 140%); opacity: 0; transition: transform .35s cubic-bezier(.3,1.4,.5,1), opacity .25s;
    display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 28px; padding: 12px 22px 12px 12px; max-width: min(640px, 92vw);
    box-shadow: 0 6px 0 rgba(58,37,22,.18), 0 10px 30px rgba(0,0,0,.12); border: 3px solid #3a2516; }
  #bubble.show { transform: translate(-50%, 0); opacity: 1; }
  #bubble-icon { flex: none; width: 58px; height: 58px; border-radius: 50%; font-size: 36px; display: grid; place-items: center; border: 3px solid #3a2516; }
  #bubble-text { font-size: 22px; font-weight: 600; color: #3a2516; line-height: 1.2; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: auto; transition: opacity .5s; }
  #start { background: radial-gradient(circle at 50% 40%, #c8ecff, #7cc4f0); z-index: 10; }
  #start.hide { opacity: 0; pointer-events: none; }
  .title { font-size: clamp(56px, 12vw, 110px); font-weight: 800; color: #fff; text-shadow: 0 6px 0 #d9412b, 0 12px 20px rgba(0,0,0,.15); margin: 0 0 4px; text-align: center; }
  .cast { font-size: 64px; text-align: center; letter-spacing: 12px; margin-bottom: 26px; }
  .bigbtn { width: 160px; height: 160px; border-radius: 50%; border: 6px solid #3a2516; background: #3fae55; color: #fff; font-size: 80px; line-height: 1;
    box-shadow: 0 10px 0 #2a7a3a; cursor: pointer; margin: 0 auto; }
  .bigbtn:active { transform: translateY(6px); box-shadow: 0 4px 0 #2a7a3a; }
  #play { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .note { margin-top: 26px; color: #fff; font-size: 16px; text-align: center; opacity: .9; text-shadow: 0 1px 2px rgba(0,0,0,.2); }
  #again { display: none; position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%) scale(0); transition: transform .5s cubic-bezier(.3,1.6,.5,1); z-index: 5; padding-left: 0; font-size: 72px; background: #ffd21a; box-shadow: 0 10px 0 #c99a00; }
  #again.show { display: flex; animation: popin .5s cubic-bezier(.3,1.6,.5,1) forwards; pointer-events: auto; }
  @keyframes popin { from { transform: translate(-50%, -50%) scale(0); } to { transform: translate(-50%, -50%) scale(1); } }
  #edge-arrow { position: fixed; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; background: #ffd21a; border: 5px solid #3a2516;
    display: flex; align-items: center; justify-content: center; color: #3a2516; box-shadow: 0 6px 0 #c99a00; pointer-events: auto; z-index: 4;
    transform: scale(0); transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
  #edge-arrow span { display: block; transform: rotate(var(--rot, 0deg)); line-height: 1; font-weight: 800; }
  #edge-arrow.show { transform: scale(1); animation: nudge 1s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: scale(1.12); } }
  body.ui-up #bubble { bottom: calc(max(22px, env(safe-area-inset-bottom)) + 150px); }
  .mode-ui { position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 26px; pointer-events: none;
    transform: translateY(170%); transition: transform .45s cubic-bezier(.3,1.4,.5,1); z-index: 4; }
  .mode-ui.show { transform: none; }
  .mode-ui button { pointer-events: auto; width: 128px; height: 128px; border-radius: 50%; border: 6px solid #3a2516; font-size: 64px; line-height: 1; cursor: pointer;
    transition: opacity .2s, filter .2s; touch-action: manipulation; }
  .mode-ui button:active { transform: translateY(5px); }
  .mode-ui button.dim { opacity: .45; filter: grayscale(.6); }
  .mode-ui button.pulse { animation: pulse 1.2s ease-in-out infinite; }
  #feed-ui button { background: #fff7e0; box-shadow: 0 8px 0 #c9b98f; }
  #dig-ui { justify-content: space-between; padding: 0 max(24px, env(safe-area-inset-left)); }
  #btn-dig { background: #8a5a32; box-shadow: 0 8px 0 #5b3a1e; width: 150px; height: 150px; }
  #btn-dump { background: #ffd21a; box-shadow: 0 8px 0 #c99a00; width: 150px; height: 150px; }
  #btn-dig svg { width: 96px; height: 96px; }
  #fade { position: fixed; inset: 0; background: #fff7e8; opacity: 0; pointer-events: none; transition: opacity .4s; z-index: 8; }
  #fade.on { opacity: 1; }
  button { -webkit-appearance: none; appearance: none; padding: 0; margin: 0; font: inherit; color: inherit;
    display: flex; align-items: center; justify-content: center; text-align: center; }
  .ico { display: block; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  .bigbtn svg { width: 46%; height: 46%; display: block; }
  #edge-arrow svg { width: 58%; height: 58%; display: block; transform: rotate(var(--rot, 0deg)); }
  .game-overlay { position: fixed; inset: 0; z-index: 3; display: none; align-items: center; justify-content: center; touch-action: none; }
  .game-overlay.show { display: flex; animation: fadein .35s; }
  @keyframes fadein { from { opacity: 0; } }
  #puzzle { background: radial-gradient(circle at 50% 50%, rgba(255,247,224,.94), rgba(236,208,150,.97)); }
  #puz-board { position: relative; border-radius: 18px; border: 6px solid #3a2516; background: #fff7e0; box-shadow: 0 8px 0 rgba(58,37,22,.25); box-sizing: content-box; }
  #puz-ghost { position: absolute; inset: 0; background-size: 100% 100%; opacity: .22; border-radius: 12px; }
  .slot { position: absolute; border: 3px dashed rgba(58,37,22,.35); box-sizing: border-box; }
  #puz-pieces { position: fixed; inset: 0; pointer-events: none; }
  .piece { position: absolute; border-radius: 12px; outline: 4px solid #fff; box-shadow: 0 6px 14px rgba(0,0,0,.28); background-repeat: no-repeat;
    pointer-events: auto; touch-action: none; transition: transform .15s; }
  .piece.drag { transform: scale(1.06); box-shadow: 0 14px 26px rgba(0,0,0,.3); transition: none; }
  .piece.placed { outline-color: transparent; border-radius: 0; box-shadow: none; pointer-events: none; transition: left .2s, top .2s; }
  #puz-board.done { animation: glow 0.9s ease-in-out 2; }
  @keyframes glow { 50% { box-shadow: 0 0 0 14px #ffd21a, 0 8px 0 rgba(58,37,22,.25); } }
  #memory { background: repeating-linear-gradient(90deg, #b7793f 0 90px, #a86d38 90px 180px); }
  #mem-grid { --card: min(19vw, 25vh); display: grid; gap: 22px; perspective: 1000px; }
  .card { width: var(--card); height: var(--card); position: relative; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transition: transform .45s; cursor: pointer; touch-action: manipulation; }
  .card.up { transform: rotateY(180deg); }
  .card .face { position: absolute; inset: 0; border-radius: 22px; border: 6px solid #3a2516; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(58,37,22,.35); }
  .card .back { background-color: #d9412b;
    background-image: linear-gradient(45deg, transparent 45%, #fff 45% 55%, transparent 55%), linear-gradient(-45deg, transparent 45%, #fff 45% 55%, transparent 55%); }
  .card .front { background: #fff7e0; transform: rotateY(180deg); font-size: calc(var(--card) * .55); }
  .card.matched .front { background: #d8f5c0; }
  .card.matched { animation: matchpop .5s; }
  @keyframes matchpop { 50% { transform: rotateY(180deg) scale(1.12); } }
  #trac-ui { justify-content: space-between; padding: 0 max(24px, env(safe-area-inset-left)); }
  #btn-brake { background: #d9412b; box-shadow: 0 8px 0 #8f2a1c; width: 150px; height: 150px; }
  #btn-gas { background: #3fae55; box-shadow: 0 8px 0 #2a7a3a; width: 170px; height: 170px; }
  #trac-ui svg { width: 62%; height: 62%; display: block; }
  #trac-ui button.held { transform: translateY(6px) scale(.97); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  #menu-btn { position: absolute; top: max(14px, env(safe-area-inset-top)); right: calc(max(16px, env(safe-area-inset-right)) + 66px); pointer-events: auto;
    width: 64px; height: 64px; border-radius: 18px; border: 4px solid #3a2516; background: #ffd21a; box-shadow: 0 4px 0 #c99a00; display: none; }
  #menu-btn.show { display: flex; animation: pulse 1.6s ease-in-out infinite; }
  #menu-btn svg { width: 62%; height: 62%; }
  #menu { background: rgba(159, 216, 255, .55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  #menu-box { position: relative; background: #fff7e0; border: 6px solid #3a2516; border-radius: 30px; padding: 22px; box-shadow: 0 10px 0 rgba(58,37,22,.3); }
  #menu-grid { --tile: min(15vw, 19vh); display: grid; grid-template-columns: repeat(5, var(--tile)); gap: 14px; }
  .tile { position: relative; width: var(--tile); height: var(--tile); border-radius: 24px; border: 5px solid #3a2516; background: #fff;
    box-shadow: 0 6px 0 #c9b98f; flex-direction: column; cursor: pointer; touch-action: manipulation; }
  .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9b98f; }
  .tile .ico { font-size: calc(var(--tile) * .48); }
  .tile .lbl { font-size: 14px; font-weight: 600; color: #3a2516; margin-top: 4px; opacity: .8; }
  .tile .done { position: absolute; top: -14px; right: -14px; font-size: 34px; display: none; }
  .tile.is-done { background: #e8f8dc; }
  .tile.is-done .done { display: block; }
  #menu-close { position: absolute; top: -24px; right: -24px; width: 56px; height: 56px; border-radius: 50%; border: 4px solid #3a2516; background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
  #menu-close svg { width: 60%; height: 60%; }
  #gear { position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); pointer-events: auto;
    width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(255,255,255,.45); opacity: .55; -webkit-touch-callout: none; }
  #gear svg { width: 100%; height: 100%; }
  #gear .ring { stroke-dasharray: 289; stroke-dashoffset: 289; transform: rotate(-90deg); transform-origin: 50% 50%; opacity: 0; }
  #gear.holding { opacity: 1; }
  #gear.holding .ring { opacity: 1; stroke: #3fae55; stroke-dashoffset: 0; transition: stroke-dashoffset 1.5s linear; }
  #parent { z-index: 30; background: rgba(20,24,40,.55); }
  #parent-box { background: #fff; border-radius: 22px; padding: 22px 26px; width: min(560px, 92vw); font-family: system-ui, sans-serif; color: #222; user-select: none; }
  #parent-box h2 { margin: 0 0 12px; font-size: 22px; }
  #parent-box label { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 10px 0; font-size: 17px; }
  #parent-box input[type=range] { width: 55%; }
  .prow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .prow > span { font-size: 17px; margin-right: auto; }
  #limit-seg { display: flex; gap: 6px; flex-wrap: wrap; }
  #limit-seg button, .pbtn { padding: 8px 14px; border-radius: 12px; border: 2px solid #3a2516; background: #fff; font-size: 16px; color: #222; }
  #limit-seg button.on { background: #3a2516; color: #fff; }
  .pbtn { padding: 10px 16px; }
  #played { margin: 4px 0; font-size: 15px; color: #555; }
  .pnote { font-size: 13px; color: #777; margin: 6px 0 4px; }
  body.night #stars, body.night #menu-btn { opacity: 0; pointer-events: none; }
  #album-btn { position: absolute; top: -24px; left: -24px; width: 64px; height: 64px; border-radius: 50%; border: 4px solid #3a2516; background: #fff; font-size: 32px; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
  #album-count { position: absolute; bottom: -6px; right: -6px; min-width: 28px; height: 28px; border-radius: 14px; background: #e8322b; color: #fff; font-size: 16px; font-weight: 800; line-height: 28px; border: 3px solid #fff; }
  #album { background: rgba(58,37,22,.25); z-index: 4; }
  #album-box { position: relative; background: #fff7e0; border: 6px solid #3a2516; border-radius: 30px; padding: 26px 26px 20px; box-shadow: 0 10px 0 rgba(58,37,22,.3);
    display: flex; gap: 20px; align-items: center; }
  #album-title { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 48px; }
  #album-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; --s: min(13vw, 17vh, 118px); }
  .aslot { width: var(--s); height: var(--s); border-radius: 50%; border: 4px dashed #d6c49a; display: grid; place-items: center; }
  .ghost { font-size: calc(var(--s, 120px) * .45); filter: grayscale(1) opacity(.25); }
  #album-all { width: min(22vw, 30vh, 200px); height: min(22vw, 30vh, 200px); border-radius: 50%; border: 4px dashed #e0b84a; display: grid; place-items: center; --s: min(22vw, 30vh, 200px); }
  #album-all .ghost { font-size: calc(var(--s) * .22); }
  #album-close { position: absolute; top: -24px; right: -24px; width: 56px; height: 56px; border-radius: 50%; border: 4px solid #3a2516; background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
  #album-close svg { width: 60%; height: 60%; }
  .sticker { width: 100%; height: 100%; border-radius: 50%; background: var(--c); border: 7px solid #fff; display: grid; place-items: center;
    box-shadow: 0 0 0 3px #3a2516, 0 6px 0 3px rgba(58,37,22,.35); transform: rotate(var(--r)); }
  .sticker span { font-size: calc(var(--s, 120px) * .5); line-height: 1; }
  #album-all .sticker span { font-size: calc(var(--s) * .24); }
  .sticker.wiggle { animation: wiggle .5s; }
  @keyframes wiggle { 0%,100% { transform: rotate(var(--r)) scale(1); } 30% { transform: rotate(calc(var(--r) - 12deg)) scale(1.12); } 60% { transform: rotate(calc(var(--r) + 10deg)) scale(1.06); } }
  .sticker.big.flyin { position: fixed; z-index: 25; left: 50%; top: 45%; width: min(36vw, 44vh); height: min(36vw, 44vh); --s: min(36vw, 44vh); margin: calc(min(36vw, 44vh) / -2) 0 0 calc(min(36vw, 44vh) / -2);
    animation: stickpop .6s cubic-bezier(.3,1.7,.5,1); transition: transform .7s cubic-bezier(.6,0,.4,1), left .7s, top .7s, opacity .7s; }
  .sticker.big.flyout { left: 50%; top: 18%; transform: rotate(var(--r)) scale(.15); opacity: 0; }
  @keyframes stickpop { 0% { transform: rotate(-40deg) scale(0); } 100% { transform: rotate(var(--r)) scale(1); } }
  .spark { position: fixed; z-index: 24; color: #ffd21a; font-size: 34px; text-shadow: 0 2px 0 #3a2516; pointer-events: none; animation: spark .9s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="stars"><div class="star">⭐</div><div class="star">⭐</div><div class="star">⭐</div><div class="star">⭐</div><div class="star">⭐</div><div class="star">⭐</div><div class="star">⭐</div><div class="star">⭐</div><div class="star">⭐</div><div class="star">⭐</div></div>
  <div id="egg-hud"><div class="egg-icon"></div><div class="egg-icon"></div><div class="egg-icon"></div><div class="egg-icon"></div><div class="egg-icon"></div></div>
  <button id="menu-btn" aria-label="Velg lek"><svg viewBox="0 0 100 100"><rect x="14" y="14" width="30" height="30" rx="7" fill="#3a2516"/><rect x="56" y="14" width="30" height="30" rx="7" fill="#3a2516"/><rect x="14" y="56" width="30" height="30" rx="7" fill="#3a2516"/><rect x="56" y="56" width="30" height="30" rx="7" fill="#3a2516"/></svg></button>
  <button id="gear" aria-label="For foreldre (hold inne)"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#3a2516" stroke-width="6" class="ring"/><path d="M50 22l6 8 10-3 2 10 10 4-4 10 6 8-9 5 1 10-10 0-4 10-9-5-8 6-5-9-10 1 1-10-9-5 6-8-4-10 10-4 2-10 10 3z" fill="#3a2516" transform="translate(50 50) scale(.62) translate(-50 -50)"/><circle cx="50" cy="50" r="9" fill="#fff"/></svg></button>
  <div id="bubble"><div id="bubble-icon"></div><div id="bubble-text"></div></div>
</div>
<div id="feed-ui" class="mode-ui">
  <button data-food="carrot" aria-label="Gulrot"><span class="ico">🥕</span></button>
  <button data-food="grass" aria-label="Gress"><span class="ico">🌿</span></button>
  <button data-food="grain" aria-label="Korn"><span class="ico">🌾</span></button>
</div>
<div id="dig-ui" class="mode-ui">
  <button id="btn-dig" aria-label="Grav"><svg viewBox="0 0 100 100"><path d="M50 8v38" stroke="#fff" stroke-width="10" stroke-linecap="round"/><path d="M34 32l16 16 16-16" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 60h64l-8 26H26z" fill="#5b616b" stroke="#3a2516" stroke-width="5" stroke-linejoin="round"/><ellipse cx="50" cy="60" rx="30" ry="9" fill="#5b3a1e"/></svg></button>
  <button id="btn-dump" aria-label="Tøm"><span class="ico">🚚</span></button>
</div>
<div id="trac-ui" class="mode-ui">
  <button id="btn-brake" aria-label="Brems"><svg viewBox="0 0 100 100"><path d="M34 12h32l22 22v32L66 88H34L12 66V34z" fill="#fff"/><rect x="26" y="44" width="48" height="12" rx="4" fill="#d9412b"/></svg></button>
  <button id="btn-gas" aria-label="Gass"><svg viewBox="0 0 100 100"><path d="M30 18l46 32-46 32z" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/></svg></button>
</div>
<div id="menu" class="game-overlay"><div id="menu-box"><div id="menu-grid"></div>
  <button id="album-btn" aria-label="Klistremerker">📒<span id="album-count">0</span></button>
  <button id="menu-close" aria-label="Lukk"><svg viewBox="0 0 100 100"><path d="M28 28l44 44M72 28L28 72" stroke="#3a2516" stroke-width="14" stroke-linecap="round"/></svg></button></div></div>
<div id="album" class="game-overlay"><div id="album-box">
  <div id="album-title">📒</div>
  <div id="album-grid"></div>
  <div id="album-all"></div>
  <button id="album-close" aria-label="Lukk"><svg viewBox="0 0 100 100"><path d="M28 28l44 44M72 28L28 72" stroke="#3a2516" stroke-width="14" stroke-linecap="round"/></svg></button></div></div>
<div id="parent" class="game-overlay"><div id="parent-box">
  <h2>For foreldre</h2>
  <label>Stemmer <input type="range" id="vol-voice" min="0" max="100"></label>
  <label>Lyder <input type="range" id="vol-sfx" min="0" max="100"></label>
  <label>Musikk og gårdslyder <input type="range" id="vol-music" min="0" max="100"></label>
  <div class="prow"><span>Spilletid</span><div id="limit-seg"><button data-min="0">Av</button><button data-min="10">10 min</button><button data-min="15">15 min</button><button data-min="20">20 min</button><button data-min="30">30 min</button></div></div>
  <p id="played"></p>
  <p class="pnote">Når tiden er ute, blir det leggetid etter leken barnet holder på med. Hold inne tannhjulet for å komme hit igjen.</p>
